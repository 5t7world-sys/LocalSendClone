name: localsend_clone
description: Share files to nearby devices. Open Source. Cross-Platform.
version: 1.18.2+118
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # UI & Design
  cupertino_icons: ^1.0.6
  flex_color_picker: ^3.4.1
  google_fonts: ^6.1.0
  
  # Networking
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.1.2
  multicast_dns: ^0.3.2+4
  network_info_plus: ^5.0.1
  connectivity_plus: ^5.0.2
  
  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  path: ^1.8.3
  open_filex: ^4.3.4
  mime: ^1.0.4
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # Security & Crypto
  crypto: ^3.0.3
  uuid: ^4.2.2
  encrypt: ^5.0.3
  
  # Permissions & System
  permission_handler: ^11.1.0
  wakelock_plus: ^1.2.1
  device_info_plus: ^9.1.1
  
  # Media & Assets
  image_picker: ^1.0.7
  photo_manager: ^3.0.0
  wechat_assets_picker: ^8.8.1
  
  # Platform Integration
  receive_sharing_intent: ^1.6.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  
  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.0
  logger: ^2.0.2+1
  flutter_markdown: ^0.6.18+2
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/
  
  # fonts:
